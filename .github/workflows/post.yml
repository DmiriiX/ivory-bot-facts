name: Facts post TG + MAX (Thursdays)

on:
  schedule:
    # Каждый час 08:00–16:00 UTC = 11:00–19:00 Москва
    # Скрипт сам проверяет, что сегодня четверг
    - cron: "0 8-16 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish fact to Telegram and MAX
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHANNEL_ID: ${{ secrets.MAX_CHANNEL_ID }}
          # Для ручного теста поставь "1", для авторежима оставь "0"
          FORCE_POST: "1"
        run: python3 scripts/post_once.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "facts state updated"
          git push
